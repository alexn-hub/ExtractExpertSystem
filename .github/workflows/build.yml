name: Build Windows Application (ExtractExpertSystem)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Позволяет запускать сборку кнопкой вручную

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Установка окружения Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Установка библиотек и компилятора
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pymodbus opcua pyyaml

      - name: Сборка через PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "ExtractExpertSystem" `
            --add-data "config.yaml;." `
            --add-data "app/gui/styles.qss;app/gui" `
            --add-data "data;data" `
            --hidden-import "sklearn.ensemble._forest" `
            --hidden-import "sklearn.ensemble._gb" `
            --hidden-import "sklearn.linear_model._ridge" `
            --hidden-import "pymodbus" `
            --hidden-import "opcua" `
            main.py

      - name: Упаковка приложения в ZIP-архив
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ExtractExpertSystem -DestinationPath ExtractExpertSystem_Windows.zip

      - name: Сохранение дистрибутива в артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: ExtractExpertSystem_Win64
          path: ExtractExpertSystem_Windows.zip
          retention-days: 14