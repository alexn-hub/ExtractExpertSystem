database:
  database: production_db
  host: localhost
  local_db_path: data/database.db
  password: ''
  port: 3306
  username: operator
hmi:
  passport_fields:
    default_main_metric: 100.0
    id_placeholder: BATCH-2026-001
    main_metric_label: Масса руды (т)
  static_parameters:
  - default: 12.0
    key: ore_hardness
    label: Твердость руды (Ед)
  - default: 30.0
    key: fraction_size
    label: КРУП!!! (мм)
  target_parameter:
    default: 85.0
    key: target_metric
    label: Извлечение / Качество (%)
    max: 100.0
    min: 0.0
  trend_parameters:
  - color: '#FF5252'
    key: mill_rpm
    label: Обороты (об/мин)
  - color: '#448AFF'
    key: water_flow
    label: Вода (м3/ч)
  - color: '#2E7D32'
    key: power_kw
    label: Мощность (кВт)
  - color: '#000000'
    key: zhopa
    label: ЖОПА!!!
  units:
  - Участок измельчения 1
  - Участок измельчения 2
  - СФР-3
model:
  n_neighbors: 5
  random_state: 42
  similarity_threshold: 0.75
process:
  max_jump_delta: 50.0
  missing_data: interpolate
  noise_filter_window: 3
  sampling_interval: 60
